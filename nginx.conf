server {
    # Rootless: unprivileged nginx darf keine Ports <1024 binden.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirect targets (behind Traefik/port mapping, no wrong port).
    absolute_redirect off;
    port_in_redirect off;

    # --- 301: old long paths -> short scheme (docs|hooks|lexicon|faq|guides) ---
    # Tracks (generic: Guidebook prefix dropped)
    rewrite ^/guidebook/guidebook-lua-(.+)/?$ /docs/lua/$1 permanent;
    rewrite ^/guidebook/guidebook-csharp-(.+)/?$ /docs/csharp/$1 permanent;
    rewrite ^/guidebook/guidebook-js-(.+)/?$ /docs/js/$1 permanent;
    rewrite ^/guidebook/guidebook-rust-(.+)/?$ /docs/rust/$1 permanent;
    rewrite ^/guidebook/guidebook-modelling-(.+)/?$ /docs/modelling/$1 permanent;
    # Guidebook specials
    rewrite ^/guidebook/guidebook/?$ /docs/overview/ permanent;
    rewrite ^/guidebook/guidebook-prerequisites/?$ /docs/start/prerequisites/ permanent;
    rewrite ^/guidebook/guidebook-debugging/?$ /guides/debugging/ permanent;
    rewrite ^/guidebook/guidebook-computer-ui/?$ /guides/computer-ui/ permanent;
    rewrite ^/guidebook/guidebook-porting-matrix/?$ /guides/porting-matrix/ permanent;
    rewrite ^/guidebook/guidebook-release/?$ /guides/release/ permanent;
    rewrite ^/guidebook/guidebook-next-languages/?$ /guides/next-languages/ permanent;
    # Player start
    rewrite ^/players/player-getting-started/?$ /docs/start/getting-started/ permanent;
    rewrite ^/players/player-installation/?$ /docs/start/installation/ permanent;
    rewrite ^/players/player-mod-users-guide/?$ /docs/start/mod-users-guide/ permanent;
    # Framework
    rewrite ^/core/core-overview/?$ /docs/core/overview/ permanent;
    rewrite ^/core/core-save-engine/?$ /docs/core/save-engine/ permanent;
    rewrite ^/hooks/core-events/?$ /hooks/events/ permanent;
    rewrite ^/hooks/hooks-reference/?$ /hooks/reference/ permanent;
    # Deep-Dive (special cases first, rest generic)
    rewrite ^/developers/developer-getting-started/?$ /docs/start/dev/ permanent;
    rewrite ^/developers/developer-environment/?$ /docs/start/environment/ permanent;
    rewrite ^/developers/developer-first-lua-mod/?$ /docs/lua/first-mod/ permanent;
    rewrite ^/developers/developer-first-csharp-mod/?$ /docs/csharp/first-mod/ permanent;
    rewrite ^/developers/developer-events-hooks-guide/?$ /hooks/guide/ permanent;
    rewrite ^/developers/developer-(.+)/?$ /docs/deep/$1 permanent;
    # FAQ + Lexicon
    rewrite ^/guides/faq-troubleshooting/?$ /faq/troubleshooting/ permanent;
    rewrite ^/glossary/?$ /lexicon/ permanent;

    # Astro static output: pretty URLs (/docs/lua/ -> /docs/lua/index.html)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Long-cache hashed assets, never cache HTML
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
